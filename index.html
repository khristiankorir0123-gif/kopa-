<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPA | Squad Hub</title>
    <style>
        :root { 
            --primary: #00d2ff; 
            --secondary: #92fe9d; 
            --bg: #0f172a; 
            --card-bg: #1e293b; 
            --text: #f8fafc; 
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            scroll-behavior: smooth; 
        }
        nav { 
            background: rgba(15, 23, 42, 0.9); 
            padding: 1rem; 
            display: flex; 
            justify-content: center; 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid #334155; 
        }
        nav a { 
            color: #94a3b8; 
            text-decoration: none; 
            margin: 0 15px; 
            font-weight: 600; 
            font-size: 0.9rem; 
        }
        .hero { 
            height: 70vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
        }
        .hero h1 { 
            font-size: 4rem; 
            background: linear-gradient(to right, var(--primary), var(--secondary)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px;
        }
        section { 
            padding: 80px 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #334155; 
        }
        .btn { 
            display: inline-block; 
            padding: 10px 20px; 
            background: var(--primary); 
            color: #000; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
        }
        iframe {
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#chat">Squad Chat</a>
        <a href="#football">Football</a>
        <a href="#media">Media</a>
    </nav>

    <section id="home" class="hero">
        <h1>KOPA SQUAD</h1>
        <p>2026 Edition • Khristian • Oliver • Panav • Ayaan</p>
    </section>

    <section id="chat">
        <h2>SQUAD CHAT</h2>
        <div class="card" style="padding: 10px; height: 500px;">
            <iframe src="https://www3.cbox.ws/box/?boxid=954203&boxtag=kopa" 
                    width="100%" 
                    height="100%" 
                    scrolling="auto">
            </iframe>
        </div>
    </section>

    <section id="football">
        <h2>SPORTS HUB</h2>
        <div class="grid">
            <div class="card">
                <h3>FotMob</h3>
                <a href="https://www.fotmob.com" target="_blank" class="btn">Live Scores</a>
            </div>
            <div class="card">
                <h3>ESPN NBA</h3>
                <a href="https://www.espn.com/nba/" target="_blank" class="btn">NBA Stats</a>
            </div>
        </div>
    </section>

    <section id="media">
        <h2>MEDIA</h2>
        <div class="grid">
            <div class="card">
                <h3>VidBox</h3>
                <a href="https://vidbox.cc" target="_blank" class="btn">Movies</a>
            </div>
            <div class="card">
                <h3>StreamEx</h3>
                <a href="https://streamex.sh" target="_blank" class="btn">Streams</a>
            </div>
        </div>
    </section>

    <footer style="text-align:center; padding: 40px; color: #64748b;">
        <p>&copy; 2026 KOPA Crew.</p>
    </footer>

</body>
</html>
